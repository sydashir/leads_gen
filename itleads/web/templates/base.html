<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hybrid Leads{% endblock %}</title>
<meta name="description" content="New IT company filings from public registries, each with a matched website and an email or a phone. An internal tool of Hybrid Mediaworks.">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='favicon-48.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=asset_v) }}">
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='app.js', v=asset_v) }}" defer></script>
</body>
</html>
